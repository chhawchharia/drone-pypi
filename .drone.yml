---
kind: pipeline
name: testing
type: vm

platform:
  os: linux
  arch: amd64

pool:
  use: ubuntu

steps:
  - name: vet
    pull: always
    image: harness0.harness.io/oci/docker_artifacts/hhi/go:1.26.10
    commands:
      - go vet ./...
    environment:
      GO111MODULE: on

  - name: test-go-sdk
    image: harness0.harness.io/oci/docker_artifacts/hhi/go:1.26.10
    commands:
      - mkdir -p .hhi-go-toolchain && cp -a /usr/lib/go/. .hhi-go-toolchain/
  - name: test
    pull: always
    image: harness0.harness.io/oci/docker_artifacts/hhi/harnessos-alpine:1
    commands:
      - export PATH="$PWD/.hhi-go-toolchain/bin:$PATH" GOPATH=/go GOTOOLCHAIN=local
      - apk --no-cache add -U python3 python3-dev git gcc glibc-dev libffi-dev openssl-dev py3-pip
      - python3 -m venv /tmp/pypi-test-env
      - . /tmp/pypi-test-env/bin/activate
      - pip3 install --no-cache-dir --upgrade pip setuptools wheel six twine
      - go test -cover ./...
    environment:
      GO111MODULE: on
      PLUGIN_DISTRIBUTIONS: sdist
      PLUGIN_PASSWORD: demo
      PLUGIN_REPOSITORY: http://pypiserver:8080/
      PLUGIN_USERNAME: demo

services:
  - name: pypiserver
    pull: always
    image: pypiserver/pypiserver
    entrypoint:
      - pypi-server
      - -P
      - .
      - -a
      - .
      - -p
      - 8080
      - /data/packages

trigger:
  branch:
    - master

---
kind: pipeline
name: linux-amd64
type: vm

platform:
  os: linux
  arch: amd64

pool:
  use: ubuntu

steps:
  - name: build-push
    pull: always
    image: harness0.harness.io/oci/docker_artifacts/hhi/go:1.26.10
    commands:
      - 'go build -v -ldflags "-X main.build=${DRONE_BUILD_NUMBER}" -a -o release/linux/amd64/drone-pypi'
    environment:
      CGO_ENABLED: 0
      GO111MODULE: on
    when:
      event:
        - push
        - pull_request

  - name: build-tag
    pull: always
    image: harness0.harness.io/oci/docker_artifacts/hhi/go:1.26.10
    commands:
      - 'go build -v -ldflags "-X main.version=${DRONE_TAG##v} -X main.build=${DRONE_BUILD_NUMBER}" -a -o release/linux/amd64/drone-pypi'
    environment:
      CGO_ENABLED: 0
      GO111MODULE: on
    when:
      event:
        - tag

  - name: executable
    pull: always
    image: harness0.harness.io/oci/docker_artifacts/hhi/go:1.26.10
    commands:
      - ./release/linux/amd64/drone-pypi --help

  - name: dryrun
    pull: always
    image: plugins/docker:linux-amd64
    settings:
      dockerfile: docker/Dockerfile.linux.amd64
      dry_run: true
      password:
        from_secret: docker_password
      repo: plugins/pypi
      tags: linux-amd64
      username:
        from_secret: docker_username
    when:
      event:
        - pull_request

  - name: publish
    pull: always
    image: plugins/docker:linux-amd64
    settings:
      auto_tag: true
      auto_tag_suffix: linux-amd64
      dockerfile: docker/Dockerfile.linux.amd64
      password:
        from_secret: docker_password
      repo: plugins/pypi
      username:
        from_secret: docker_username
    when:
      event:
        - push
        - tag

trigger:
  branch:
    - master

depends_on:
  - testing

